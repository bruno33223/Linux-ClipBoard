name: Manual Snap Build

on:
  workflow_dispatch:

jobs:
  build-snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # --- SETUP ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      # --- BUILD ---
      
      # 1. Build Tauri (Necessário para gerar os binários que o Snapcraft vai empacotar)
      - name: Build Tauri Bundles
        run: npm run tauri build

      # 2. Build Snap
      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build

      - name: Fix WebKitGTK Layout in Snap
        id: fix-layout
        run: |
          RAW_SNAP="${{ steps.build.outputs.snap }}"
          echo "Descompactando snap: $RAW_SNAP"
          unsquashfs -d squashfs-root "$RAW_SNAP"
          sed -i 's|\$SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1|\$SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1|g' squashfs-root/meta/snap.yaml
          FIXED_SNAP="$(dirname "$RAW_SNAP")/fixed_$(basename "$RAW_SNAP")"
          snapcraft pack squashfs-root --output "$FIXED_SNAP"
          echo "snap=$FIXED_SNAP" >> "$GITHUB_OUTPUT"

      # --- ARTIFACT UPLOAD ---
      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-clipboard-snap
          path: ${{ steps.fix-layout.outputs.snap }}
